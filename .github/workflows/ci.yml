name: FleetOps checks
on:
  push:
    branches: [main, fleetops-packaging]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y libldap2-dev libsasl2-dev
      - run: python -m pip install -r backend/requirements.txt 'ansible-core>=2.19,<2.20' pytest
      - run: python tests/check_static.py
      - run: python tests/runtime_smoke.py
      - run: python -m pytest tests/test_auth.py -q
        env:
          FLEETOPS_DATA_DIR: /tmp/fleetops-ci
          FLEETOPS_DATABASE_URL: sqlite:////tmp/fleetops-ci/test.db
          FLEETOPS_CONFIG: /tmp/fleetops-ci/missing.conf
