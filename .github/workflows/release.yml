name: Build FleetOps offline release
on:
  push:
    branches: [fleetops-packaging]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fleetops-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both OS bundles
        run: CONTAINER_ENGINE=docker bash build.sh 9 10
      - name: Test both installers without networking
        run: |
          CONTAINER_ENGINE=docker bash packaging/test-offline.sh 9 ci
          CONTAINER_ENGINE=docker bash packaging/test-offline.sh 10 ci
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fleetops-2.1.0-offline
          path: releases/2.1.0/
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.1.0 >/dev/null 2>&1; then
            gh release edit v2.1.0 --draft --target "${{ github.sha }}" --title 'FleetOps 2.1.0' --notes-file RELEASE_NOTES.md
            gh release upload v2.1.0 --clobber releases/2.1.0/*.tar.gz releases/2.1.0/el9/rpms/fleetops-*.rpm releases/2.1.0/el10/rpms/fleetops-*.rpm releases/2.1.0/SHA256SUMS
          else
            gh release create v2.1.0 --draft --target "${{ github.sha }}" --title 'FleetOps 2.1.0' --notes-file RELEASE_NOTES.md releases/2.1.0/*.tar.gz releases/2.1.0/el9/rpms/fleetops-*.rpm releases/2.1.0/el10/rpms/fleetops-*.rpm releases/2.1.0/SHA256SUMS
          fi
