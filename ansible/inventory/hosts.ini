# MAC — Maytag Ansible Console — Default Inventory
# Edit this file to add your target hosts.
#
# FORMAT
#   hostname  ansible_host=IP  ansible_user=USER  ansible_ssh_private_key_file=~/.ssh/KEY
#
# EXAMPLE
#   vm01  ansible_host=192.168.1.100  ansible_user=ansible  ansible_ssh_private_key_file=/home/ansibleops/.ssh/ansible_key

[rocky9_vms]
# vm01  ansible_host=192.168.1.100  ansible_user=ansible  ansible_ssh_private_key_file=/home/ansibleops/.ssh/ansible_key
# vm02  ansible_host=192.168.1.101  ansible_user=ansible  ansible_ssh_private_key_file=/home/ansibleops/.ssh/ansible_key

# FreeIPA clients — hosts to enroll into lrn.sys domain
# Run: ansible-playbook playbooks/freeipa_client_enroll.yml --ask-vault-pass
[ipa_clients]
# vm01  ansible_host=192.168.1.100  ansible_user=ansible  ansible_ssh_private_key_file=/home/ansibleops/.ssh/ansible_key
# vm02  ansible_host=192.168.1.101  ansible_user=ansible  ansible_ssh_private_key_file=/home/ansibleops/.ssh/ansible_key

[docker_hosts]
# docker01  ansible_host=192.168.1.110  ansible_user=ansible

[web_servers]
# web01  ansible_host=192.168.1.120  ansible_user=ansible

[db_servers]
# db01  ansible_host=192.168.1.130  ansible_user=ansible

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_become=yes
ansible_become_method=sudo
