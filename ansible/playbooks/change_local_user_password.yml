---
###############################################################
# Playbook : change_local_user_password.yml
# Purpose  : Change the password for an existing local user
#            on all (or targeted) hosts
#            - Verifies the user exists before attempting change
#            - Reads new hashed password from ansible-vault
#            - Optionally forces a password-change on next login
#            - Reports per-host success / skip / failure
#
# Usage:
#   ansible-playbook playbooks/change_local_user_password.yml \
#     -i ../inventory/hosts.ini \
#     -e "target_user=jsmith" \
#     --ask-vault-pass
#
# Required extra vars:
#   target_user       — login name whose password will be changed
#
# Optional extra vars:
#   force_pw_expire   — true|false  force change at next login  (default: true)
#   target_hosts      — override host pattern                   (default: all)
#
# Password:
#   Set vault_new_user_password in group_vars/all/vault.yml (ansible-vault).
#   It must be a pre-hashed shadow entry.  Generate with:
#     python3 -c "from passlib.hash import sha512_crypt; \
#                 print(sha512_crypt.using(rounds=5000).hash('NewP@ssw0rd'))"
###############################################################

- name: "Change Local User Password — {{ target_user | default('UNDEFINED') }}"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: yes
  become: yes

  vars:
    force_pw_expire: "{{ force_pw_expire | default(true) | bool }}"
    # Store hashed password in group_vars/all/vault.yml encrypted with ansible-vault
    # vault_new_user_password: "$6$rounds=5000$..."
    new_user_password: "{{ vault_new_user_password }}"

  pre_tasks:

    - name: Validate that target_user is defined
      assert:
        that:
          - target_user is defined
          - target_user | length > 0
        fail_msg: "Pass the username as: -e 'target_user=<loginname>'"

    - name: Validate that vault_new_user_password is defined
      assert:
        that:
          - vault_new_user_password is defined
          - vault_new_user_password | length > 0
        fail_msg: >
          'vault_new_user_password' must be set in vault.yml as a SHA-512
          hashed string.  Generate with:
            python3 -c "from passlib.hash import sha512_crypt; print(sha512_crypt.using(rounds=5000).hash('YourNewPassword'))"

    - name: Verify target user exists on this host
      getent:
        database: passwd
        key: "{{ target_user }}"
      register: r_getent
      ignore_errors: yes

    - name: Warn and skip host if user does not exist
      debug:
        msg: >
          WARNING: user '{{ target_user }}' does not exist on
          {{ inventory_hostname }} — skipping password change for this host.
      when: r_getent is failed

  tasks:

    # ── Password change ───────────────────────────────────────────────────────

    - name: Set new password for {{ target_user }}
      user:
        name:            "{{ target_user }}"
        password:        "{{ new_user_password }}"
        update_password: always
      no_log: true
      register: r_pw_change
      when: r_getent is not failed

    # ── Optional: force change at next login ─────────────────────────────────

    - name: Expire password (force change at next login)
      command: chage -d 0 "{{ target_user }}"
      changed_when: true
      when:
        - r_getent is not failed
        - force_pw_expire | bool

    # ── Verification ──────────────────────────────────────────────────────────

    - name: Read current password aging info
      command: chage -l "{{ target_user }}"
      register: r_chage
      changed_when: false
      when: r_getent is not failed

    - name: Confirm password entry is not locked or empty
      shell: >
        passwd -S "{{ target_user }}" 2>/dev/null
      register: r_passwd_status
      changed_when: false
      when: r_getent is not failed

    - name: Summary
      debug:
        msg:
          - "Host           : {{ inventory_hostname }}"
          - "User           : {{ target_user }}"
          - "User exists    : {{ 'yes' if r_getent is not failed else 'NO — skipped' }}"
          - "Password set   : {{ 'yes' if (r_pw_change is defined and r_pw_change is not skipped) else 'skipped' }}"
          - "Forced expire  : {{ force_pw_expire | bool }}"
          - "Account status : {{ r_passwd_status.stdout | default('N/A') }}"
          - "Password aging : {{ r_chage.stdout_lines | default([]) }}"
      when: r_getent is not failed

    - name: Summary (skipped host)
      debug:
        msg: "SKIPPED — user '{{ target_user }}' not found on {{ inventory_hostname }}"
      when: r_getent is failed
