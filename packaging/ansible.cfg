[defaults]
inventory = /var/lib/fleetops/ansible/inventory/hosts.ini
roles_path = /var/lib/fleetops/ansible/roles
host_key_checking = True
retry_files_enabled = False
local_tmp = /var/lib/fleetops/.ansible/tmp
log_path = /var/lib/fleetops/logs/ansible.log
timeout = 30

[ssh_connection]
pipelining = True
